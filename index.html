<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptVault · 提示词宝库</title>
<link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png">
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #F5F5F7;
    color: #1D1D1F;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .logo {
    width: 72px; height: 72px;
    border-radius: 18px;
    object-fit: cover;
    display: block;
    margin: 0 auto 20px;
    box-shadow: 0 12px 32px rgba(10, 132, 255, 0.25);
  }
  h1 { font-size: 28px; font-weight: 700; }
  .sub { color: #6E6E73; margin: 8px 0 32px; font-size: 15px; }
  .actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .btn {
    display: inline-block;
    padding: 12px 28px;
    border-radius: 980px;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary { background: #0071E3; color: #fff; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0, 113, 227, 0.3); }
  .btn-secondary { background: #fff; color: #1D1D1F; border: 1px solid #D2D2D7; }
  .btn-secondary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08); }
  footer {
    margin-top: 48px;
    font-size: 12px;
    color: #6E6E73;
  }
  footer a { color: #0071E3; text-decoration: none; }
</style>
</head>
<body>
  <img class="logo" src="assets/favicon.png" alt="PromptVault">
  <h1>PromptVault</h1>
  <p class="sub">提示词宝库 · AI Prompt Manager</p>
  <div class="actions">
    <a class="btn btn-primary" href="prompt-vault.html">中文版</a>
    <a class="btn btn-secondary" href="prompt-vault.en.html">English</a>
  </div>
  <footer>v1.4.0 · <a href="https://github.com/YesonWyld/prompt-vault" target="_blank" rel="noopener">YesonWyld</a></footer>
</body>
</html>
